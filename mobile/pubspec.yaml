name: svsu_assistant
description: SVSU Knowledge Assistant for Android. Talks to the same API as the web app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
