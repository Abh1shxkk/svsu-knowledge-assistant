 decide:t=>{const d=getDoc(S.reviewSel);const cm=$('#revc').value.trim();const v=t.dataset.v;
   if(v!=='approve'&&!cm){$('#revc').classList.add('err');$('#revc').focus();toast('Add a comment for the uploader');return;}
   const by='Dr. Neha Sharma, Deputy Registrar';
   if(v==='approve'){d.status='Active';if(d.visibility==='Management Only'&&d.id==='D12') d.visibility='All Staff';d.approvals.push({step:'Approved and published',by,date:TODAY_S,kind:'ok',note:cm});if(d.revisionOf){const o=getDoc(d.revisionOf);if(o&&o.status==='Active'){o.status='Superseded';o.supersededBy=d.id;}}S.audit.unshift({t:nowStr(),who:'Dr. Neha Sharma',act:'Approved',what:d.title});toast('Approved and published to the library');}
   if(v==='changes'){d.status='Changes requested';d.approvals.push({step:'Changes requested',by,date:TODAY_S,kind:'warn',note:cm});toast('Sent back to '+d.uploadedBy+' with your comment');}
   if(v==='reject'){d.status='Rejected';d.approvals.push({step:'Rejected',by,date:TODAY_S,kind:'bad',note:cm});toast('Document rejected');}

/* ---------- Forms ---------- */
const F={
 ask:()=>{const q=$('#q');const v=q.value;q.value='';q.style.height='';ask(v)},
 editMeta:(f,fd)=>{const d=getDoc(fd.get('id'));['title','ref','type','authority','dept','date','effective','expiry','institution','description'].forEach(k=>d[k]=fd.get(k));const aud=fd.getAll('aud');if(aud.length) d.audience=aud;const lv=d.versions[d.versions.length-1];d.versions.push({v:(parseFloat(lv.v)+0.1).toFixed(1),date:TODAY_S,by:'Dr. Neha Sharma',note:'Metadata edited'});S.audit.unshift({t:nowStr(),who:'Dr. Neha Sharma',act:'Edited',what:d.title});closeOv();toast('Metadata saved');render()},
 addTag:(f,fd)=>{const d=getDoc(fd.get('id'));const t=fd.getAll('t');if(!t.length){toast('Choose at least one tag');return;}d.tags.push(...t);closeOv();toast('Tags added');render()},
 linkDoc:(f,fd)=>{const d=getDoc(fd.get('id'));const r=fd.get('r');if(!r){toast('Choose a document');return;}d.related.push(r);const o=getDoc(r);if(!o.related.includes(d.id)) o.related.push(d.id);closeOv();toast('Documents linked');S.params.tab='related';render()},
 addRev:(f,fd)=>{const d=getDoc(fd.get('id'));const n=fd.get('n').trim();if(!n){toast('Describe what changed');return;}const file=fd.get('f');d.versions.push({v:fd.get('v'),date:TODAY_S,by:'Dr. Neha Sharma',note:n+(file&&file.name?` (file: ${file.name})`:'')+' — pending approval'});d.approvals.push({step:'Revision v'+fd.get('v')+' submitted',by:'Dr. Neha Sharma',date:TODAY_S,kind:'warn',note:n});closeOv();toast('Revision submitted for approval');S.params.tab='versions';render()},
 withdraw:(f,fd)=>{const d=getDoc(fd.get('id'));const r=fd.get('r').trim();if(!r){toast('Add a reason');return;}d.status='Withdrawn';d.withdrawReason=r;d.approvals.push({step:'Withdrawn',by:'Dr. Neha Sharma, Deputy Registrar',date:fd.get('d')||TODAY_S,kind:'bad',note:r});S.audit.unshift({t:nowStr(),who:'Dr. Neha Sharma',act:'Withdrawn',what:d.title});closeOv();toast('Document withdrawn. It will no longer be used in answers.');render()},
 fb:(f,fd)=>{const [ch,m]=findMsg(fd.get('m'));m.fb='down';S.feedback.unshift({id:nid('f'),q:m.q,rating:'down',reason:fd.get('r'),comment:fd.get('c')||'',who:S.role==='admin'?'Dr. Neha Sharma':'Dr. Sameer Khan',when:'12 Oct 2026'});closeOv();toast('Feedback sent to Reports & Feedback');rerenderMsgs()},
 saveChat:(f,fd)=>{const ch=activeChat();ch.saved=true;ch.savedName=fd.get('n');ch.title=fd.get('n');closeOv();toast('Conversation saved');render()},
 renameChat:(f,fd)=>{const ch=S.chats.find(c=>c.id===fd.get('id'));ch.savedName=fd.get('n');ch.title=fd.get('n');closeOv();toast('Renamed');render()},
 scope:(f,fd)=>{const mode=fd.get('mode');const files=fd.getAll('f');if(mode==='files'&&!files.length){toast('Select at least one file');return;}S.scope={mode,files,coll:fd.get('coll')};closeOv();toast('Scope: '+scopeLabel());render()},
 filters:(f,fd)=>{['dept','subject','type','from','to'].forEach(k=>S.filters[k]=fd.get(k)||'');closeOv();toast(filterCount()?`${filterCount()} filter(s) applied · ${scopeDocs().length} documents in scope`:'No filters applied');render()},
 reqDoc:(f,fd)=>{const u=fd.get('u')?S.unanswered.find(x=>x.id===fd.get('u')):S.unanswered.find(x=>x.q===fd.get('q'));if(u){u.status='Requested';u.dept=fd.get('d');}closeOv();toast('Request sent to '+fd.get('d')+' (simulated)');if(S.view!=='ask') render()},
 assignU:(f,fd)=>{const u=S.unanswered.find(x=>x.id===fd.get('u'));u.dept=fd.get('d');u.status='Assigned';closeOv();toast('Assigned to '+u.dept);render()},
 uploadSubmit:()=>{const it=curItem();const m=it.meta;const e={};
   if(!m.title.trim()) e.title='Enter the document title';if(!m.ref.trim()) e.ref='Enter the reference or letter number';if(!m.type) e.type='Choose a document type';if(!m.authority) e.authority='Choose the issuing authority';if(!m.dept) e.dept='Choose the issuing department';if(!m.date) e.date='Enter the date on the document';if(!m.audience.length) e.audience='Choose at least one audience';if(!m.tags.length) e.tags='Choose at least one subject tag';if(!m.visibility) e.visibility='Choose who can see this document';if(m.revRel!=='new'&&!m.revDoc) e.revDoc='Choose the document this revises';
   if(m.expiry&&m.effective&&m.expiry<m.effective) e.expiry='Expiry date must be after the effective date';
   it.errors=e;
   if(Object.keys(e).length){renderUForm();setTimeout(()=>{const k=Object.keys(e)[0];const el=$('#u-'+k)||$('[name=uvis]');el&&el.scrollIntoView({block:'center'});},20);return;}
   const id='D'+(S.docs.length+1+Math.floor(Math.random()*90));
   const d=D({id,title:m.title,ref:m.ref,type:m.type,authority:m.authority,dept:m.dept,institution:m.institution,date:m.date,effective:m.effective||m.date,expiry:m.expiry,audience:m.audience,tags:m.tags,visibility:m.visibility,status:'Pending',fileType:it.kind==='img'?'img':it.kind,related:m.related,revisionOf:m.revRel!=='new'?m.revDoc:null,description:m.description,uploadedBy:'Dr. Neha Sharma',uploadedOn:TODAY_S,
     approvals:[{step:'Submitted for approval',by:'Dr. Neha Sharma',date:TODAY_S,kind:'',note:it.sample?'Sample upload':'Uploaded from local file '+it.name}],
     pagesRaw:[[['b1','Subject: '+m.title+'.','subj'],['b2',(it.ocr||it.text||('Content of '+it.name+' is not available in the prototype.')).replace(/\n+/g,' ').slice(0,600)]]]});
   if(d.fileType==='img') d.fileType='scan',d.ocr=it.conf||0;
   S.docs.push(d);it.status='submitted';it.docId=id;S.audit.unshift({t:nowStr(),who:'Dr. Neha Sharma',act:'Submitted',what:m.title});
   toast('Submitted for approval');renderSide();renderQueue();renderUForm();},
 newColl:(f,fd)=>{const co={id:nid('C'),name:fd.get('n'),desc:fd.get('d')||'',docs:fd.getAll('f'),owner:S.role==='admin'?'Dr. Neha Sharma':'Dr. Sameer Khan',updated:TODAY_S};S.collections.unshift(co);closeOv();toast('Collection created');go('coll',{id:co.id})},
 collAdd:(f,fd)=>{const co=S.collections.find(x=>x.id===fd.get('id'));const fs=fd.getAll('f');co.docs.push(...fs);co.updated=TODAY_S;closeOv();toast(`${fs.length} document(s) added`);render()},
 collEdit:(f,fd)=>{const co=S.collections.find(x=>x.id===fd.get('id'));co.name=fd.get('n');co.desc=fd.get('d');closeOv();toast('Collection updated');render()},
 dlRemind:(f,fd)=>{const x=S.deadlines.find(y=>y.id===fd.get('id'));x.reminder=fd.get('w')+' via '+(fd.getAll('c').join(', ')||'ERP notification');closeOv();toast('Reminder set (simulated)');render()},
 addDl:(f,fd)=>{const doc=getDoc(fd.get('doc'));const b=doc.pages[0].find(x=>x.kind!=='subj')||doc.pages[0][0];S.deadlines.push({id:nid('dl'),title:fd.get('t'),date:fd.get('d'),doc:doc.id,page:1,block:b.id,quote:Array.isArray(b.text)?'':b.text,owner:fd.get('o'),aud:fd.get('a'),dept:doc.dept});closeOv();toast('Deadline added');render()},
 addUser:(f,fd)=>{S.users.push({id:nid('us'),name:fd.get('n'),email:fd.get('e'),role:fd.get('r'),dept:fd.get('d'),active:true,last:'Never'});closeOv();toast('User added. An invitation would be emailed in the full product.');render()},
 renameTag:(f,fd)=>{const o=fd.get('o'),n=fd.get('n').trim();if(!n) return;TAGS[TAGS.indexOf(o)]=n;S.docs.forEach(d=>d.tags=d.tags.map(t=>t===o?n:t));closeOv();toast('Tag renamed');render()},
 addTagAdmin:(f,fd)=>{const t=(fd.get('t')||'').trim();if(!t){toast('Enter a tag name');return;}if(TAGS.includes(t)){toast('That tag already exists');return;}TAGS.push(t);toast('Tag added');render()},
 addDept:(f,fd)=>{const t=(fd.get('t')||'').trim();if(!t){toast('Enter a department name');return;}DEPTS.push(t);toast('Department added');render()},
};

/* ---------- Input handlers ---------- */
const ON={
 lib:t=>{S.lib[t.dataset.k]=t.value;if(t.dataset.k==='sort') return renderLibResults();renderLibResults()},
 setVis:t=>{const d=getDoc(t.dataset.id);d.visibility=t.value;S.audit.unshift({t:nowStr(),who:'Dr. Neha Sharma',act:'Changed access',what:d.title+' → '+t.value});toast('Access changed to '+t.value)},
 hsearch:t=>{const g={};S.chats.forEach(c=>{(g[c.when]=g[c.when]||[]).push(c)});$('#hlist').innerHTML=histList(g,t.value.toLowerCase())},

 files:t=>{addLocalFiles(t.files);t.value=''},

 metaR:t=>{curItem().meta.revRel=t.value;renderUForm()},
 metaArr:t=>{const it=curItem();const k=t.dataset.k;const a=it.meta[k];if(t.checked&&!a.includes(t.value)) a.push(t.value);if(!t.checked) it.meta[k]=a.filter(x=>x!==t.value);delete it.errors[k]},
 dlDept:t=>{S.dlDept=t.value;render()},
 userRole:t=>{const u=S.users.find(x=>x.id===t.dataset.id);u.role=t.value;toast(u.name+' is now '+t.value)},
 matrix:t=>{S.roleMatrix[t.dataset.r][+t.dataset.i]=t.checked?1:0;toast('Access updated for '+t.dataset.r)},
 auditF:t=>{S.params.af=t.value;render()},
 aiSet:t=>{S.aiSettings[t.dataset.k]=t.checked},
 aiLang:t=>{S.aiSettings.lang=t.value;S.ansLang=t.value},
};

/* ---------- Global listeners ---------- */
document.addEventListener('click',e=>{
  const dd=$('#ndrop');if(dd&&!e.target.closest('#ndrop')&&!e.target.closest('[data-a="notifs"]')) dd.remove();
  if(e.target.classList.contains('ov')){closeOv();return;}
  const t=e.target.closest('[data-a]');if(!t) return;
  if(t.tagName==='BUTTON'&&t.type!=='submit'||t.tagName==='A'||t.getAttribute('role')==='button') e.preventDefault();
  const f=A[t.dataset.a];if(f) f(t,e);
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const fn=F[f.dataset.f];if(fn) fn(f,new FormData(f));});
const onField=e=>{const t=e.target.closest('[data-on]');if(!t) return;if(e.type==='input'&&(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='radio'||t.type==='file'||t.type==='date')) return;const fn=ON[t.dataset.on];fn&&fn(t,e)};
document.addEventListener('input',onField);
document.addEventListener('change',e=>{const t=e.target.closest('[data-on]');if(!t) return;if(t.tagName==='INPUT'&&['text','search','email',''].includes(t.type)&&t.dataset.on!=='files') return;if(t.tagName==='TEXTAREA') return;const fn=ON[t.dataset.on];fn&&fn(t,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#overlay').innerHTML) closeOv();else if(S.viewer) closeViewer();$('#ndrop')&&$('#ndrop').remove();}
  if(e.target.id==='q'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#askform').requestSubmit();}
  if(e.target.id==='gsearch'&&e.key==='Enter'){S.lib.q=e.target.value;e.target.value='';go('library');}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const dz=e.target.closest&&e.target.closest('#drop');if(!dz) return;e.preventDefault();if(ev==='dragover') dz.classList.add('over');else dz.classList.remove('over');if(ev==='drop'&&e.dataTransfer.files.length) addLocalFiles(e.dataTransfer.files);}));

render();
</script>
