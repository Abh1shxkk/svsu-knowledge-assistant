<title>SVSU Knowledge Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: registry desk — navy rail on the left, quiet work surface, warm paper for official records, document viewer docked right. */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --surface-2:#f7f8fc; --line:#e0e3ee; --line-2:#c9cfe0;
  --fg:#181b2d; --fg-2:#4a5072; --fg-3:#767d9b;
  --brand:#25318f; --brand-2:#3644b5; --brand-soft:#e7e9f9; --brand-ink:#ffffff;
  --rail:#1b2470; --rail-fg:#d8dcf7; --rail-dim:#8f97cf; --rail-act:#2c3796;
  --green:#2d7a31; --green-soft:#e2f1e1;
  --amber:#8f5b00; --amber-soft:#fcf0d4;
  --red:#ad271f; --red-soft:#fbe4e1;
  --paper:#fffef9; --paper-fg:#1c1e2a; --paper-line:#e7e2d4; --paper-dim:#6b6a63;
  --hl:#ffe27a; --hl-ring:#d9a200;
  --shadow:0 1px 2px rgba(22,28,72,.06),0 6px 20px rgba(22,28,72,.07);
  --f-ui:"IBM Plex Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4","Noto Serif Devanagari",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --surface:#151a2d; --surface-2:#1a2037; --line:#262c47; --line-2:#363e60;
  --fg:#e6e8f5; --fg-2:#a9afcb; --fg-3:#7b829f;
  --brand:#97a2ff; --brand-2:#b0b8ff; --brand-soft:#222a55; --brand-ink:#0d1020;
  --rail:#0a0d1b; --rail-fg:#cfd4f3; --rail-dim:#7d85b3; --rail-act:#1f2752;
  --green:#7dc982; --green-soft:#16301b; --amber:#f2b648; --amber-soft:#33270d; --red:#ff8d82; --red-soft:#3b1917;
  --paper:#1e2236; --paper-fg:#e5e6ef; --paper-line:#30364f; --paper-dim:#9da1b4;
  --hl:rgba(255,204,60,.36); --hl-ring:#ffcc3c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1020; --surface:#151a2d; --surface-2:#1a2037; --line:#262c47; --line-2:#363e60;
  --fg:#e6e8f5; --fg-2:#a9afcb; --fg-3:#7b829f;
  --brand:#97a2ff; --brand-2:#b0b8ff; --brand-soft:#222a55; --brand-ink:#0d1020;
  --rail:#0a0d1b; --rail-fg:#cfd4f3; --rail-dim:#7d85b3; --rail-act:#1f2752;
  --green:#7dc982; --green-soft:#16301b; --amber:#f2b648; --amber-soft:#33270d; --red:#ff8d82; --red-soft:#3b1917;
  --paper:#1e2236; --paper-fg:#e5e6ef; --paper-line:#30364f; --paper-dim:#9da1b4;
  --hl:rgba(255,204,60,.36); --hl-ring:#ffcc3c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--fg-3)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}

/* App frame */
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.side{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;min-height:0;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px}
.brand b{display:block;font-size:13.5px;line-height:1.2;color:#fff}
.brand span{font-size:11px;color:var(--rail-dim);letter-spacing:.04em;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--rail-fg);padding:9px 10px;border-radius:8px;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--rail-act);color:#fff;font-weight:500}
.nav button .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-dim);padding:12px 10px 4px}
.me{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.side .av{background:#3a46ad;color:#fff}
.me b{display:block;font-size:13px;color:#fff;font-weight:500}
.me span{font-size:11.5px;color:var(--rail-dim)}
.me button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--rail-fg);border-radius:6px;font-size:11px;padding:4px 7px}

.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{margin-left:auto;position:relative;flex:0 1 340px;min-width:0}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px 8px 34px}
.gsearch svg{position:absolute;left:10px;top:9px;color:var(--fg-3)}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg-2);position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.menu-btn{display:none}
.strip{background:var(--amber-soft);color:var(--amber);font-size:12px;padding:5px 20px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.strip b{font-weight:600}
.workspace{flex:1;display:flex;min-height:0}
.content{flex:1;overflow:auto;min-width:0;padding:24px 28px 48px}
.content.chatmode{padding:0;overflow:hidden;display:flex}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Generic components */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:600}
.card-b{padding:14px 16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h2{font-family:var(--f-doc);font-size:26px;font-weight:600;letter-spacing:-.01em}
.pagehead p{color:var(--fg-2);margin-top:4px;max-width:70ch}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:20px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.mute{background:var(--surface-2);color:var(--fg-3);border-color:var(--line)}
.pill.mute2{background:var(--surface-2);color:var(--fg-2);border-color:var(--line-2)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.pill.plain::before{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tag button{border:0;background:none;padding:0;color:var(--fg-3);line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.ft{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.04em;border-radius:5px;padding:2px 5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg-2)}
.ft-pdf{color:var(--red)} .ft-scan{color:var(--amber)} .ft-docx{color:var(--brand)} .ft-xlsx{color:var(--green)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.inp{resize:vertical}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12.5px;font-weight:500;color:var(--fg-2)}
.fld>label i{color:var(--red);font-style:normal}
.fld .hint{font-size:11.5px;color:var(--fg-3)}
.fld .errmsg{font-size:11.5px;color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;font-size:12.5px;cursor:pointer;background:var(--surface);user-select:none}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:500}
.chk:has(input:focus-visible){outline:2px solid var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--fg-2)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:13px;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:500}
.tabs button .c{font-size:11px;color:var(--fg-3);margin-left:4px}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--fg-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:9px 16px;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;min-width:0}
.link{color:var(--brand);background:none;border:0;padding:0;text-align:left;font-weight:500}
.link:hover{text-decoration:underline}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;align-items:flex-start}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.bad{background:var(--red-soft);color:var(--red)}
.note.info{background:var(--brand-soft);color:var(--brand)}
.note.ok{background:var(--green-soft);color:var(--green)}
.note p{color:var(--fg)}
.note b{color:inherit}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--brand)}
.kpi span{font-size:12px;color:var(--fg-3)}
.kpi b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-family:var(--f-doc)}
.kpi small{font-size:11.5px;color:var(--fg-2)}
.dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);text-align:left}
.sc:hover{border-color:var(--brand)}
.sc .ic{width:34px;height:34px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.sc b{display:block;font-size:13px;font-weight:500}
.sc span{font-size:11.5px;color:var(--fg-3)}
.li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main span{font-size:12px;color:var(--fg-3)}
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.datebox i{display:block;font-style:normal;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--brand-soft);color:var(--brand);padding:1px 0}
.datebox b{display:block;font-size:16px;font-weight:600;padding:2px 0;font-variant-numeric:tabular-nums}
.due{font-size:11.5px;font-weight:500;white-space:nowrap}
.due.soon{color:var(--amber)} .due.over{color:var(--red)} .due.later{color:var(--fg-3)} .due.done{color:var(--green)}
.bars{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.bar .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

/* Library */
.libbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.libbar .search{flex:1 1 280px;position:relative;min-width:0}
.libbar .search input{padding-left:34px}
.libbar .search svg{position:absolute;left:10px;top:10px;color:var(--fg-3)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.filters .fld>label{font-size:11.5px}
.drow{display:grid;grid-template-columns:44px minmax(0,2.6fr) minmax(0,1.2fr) 110px 110px;gap:14px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.drow:hover{background:var(--surface-2)}
.drow:last-child{border-bottom:0}
.drow .tt b{display:block;font-weight:500;font-size:13.5px}
.drow .tt span{color:var(--fg-3);font-size:12px}
.dhead{display:grid;grid-template-columns:44px minmax(0,2.6fr) minmax(0,1.2fr) 110px 110px;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.dgrid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.dcard:hover{border-color:var(--brand)}
.dcard .thumb{height:118px;background:var(--surface-2);border-bottom:1px solid var(--line);position:relative;overflow:hidden;padding:14px 18px 0}
.dcard .thumb .mini{background:var(--paper);height:100%;border:1px solid var(--paper-line);border-bottom:0;border-radius:3px 3px 0 0;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.dcard .thumb .mini i{display:block;height:4px;border-radius:2px;background:var(--paper-line)}
.dcard .thumb .ft{position:absolute;top:8px;right:8px}
.dcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.dcard .body b{font-weight:500;font-size:13.5px;line-height:1.35}

/* Doc detail */
.dhero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dhero h2{font-family:var(--f-doc);font-size:24px;font-weight:600;line-height:1.25;max-width:60ch}
.crumb{font-size:12.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;color:var(--brand);padding:0}
.dlayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.pagesbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px;align-items:center;max-height:760px;overflow:auto}
.timeline{display:flex;flex-direction:column;gap:0;padding:6px 16px 14px}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-top:12px}
.tl::before{content:"";position:absolute;left:8px;top:26px;bottom:-12px;width:1px;background:var(--line-2)}
.tl:last-child::before{display:none}
.tl i{width:17px;height:17px;border-radius:50%;border:2px solid var(--brand);background:var(--surface);margin-top:2px}
.tl.ok i{border-color:var(--green);background:var(--green-soft)}
.tl.warn i{border-color:var(--amber);background:var(--amber-soft)}
.tl.bad i{border-color:var(--red);background:var(--red-soft)}
.tl b{font-weight:500;font-size:13px}
.tl span{display:block;font-size:12px;color:var(--fg-3)}
.tl p{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.exttext{font-family:var(--f-doc);font-size:14.5px;line-height:1.7;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;max-height:560px;overflow:auto}

/* Paper (official document) */
.paper{flex:none;position:relative;background:var(--paper);color:var(--paper-fg);width:100%;max-width:680px;border:1px solid var(--paper-line);box-shadow:var(--shadow);padding:44px 52px 56px;font-family:var(--f-doc);font-size:14.5px;line-height:1.7;overflow:hidden;transform-origin:top center}
.paper .wm{position:absolute;right:-30px;top:40%;transform:rotate(-30deg);font-family:var(--f-ui);font-weight:700;font-size:54px;letter-spacing:.2em;color:var(--paper-fg);opacity:.04;pointer-events:none}
.lh{display:flex;gap:14px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--paper-fg)}
.lh img{width:58px;height:58px;border-radius:50%}
.lh-n{font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.2}
.lh-s{font-size:11.5px;color:var(--paper-dim);font-family:var(--f-ui)}
.lh-o{font-size:12.5px;font-weight:600;margin-top:2px}
.lh-ref{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11.5px;margin:10px 0 18px;color:var(--paper-dim);flex-wrap:wrap}
.blk{margin:0 0 12px;position:relative;border-radius:3px;transition:background .3s}
.blk.subj{font-weight:600;margin-bottom:16px}
.blk.hlb::before{content:"";position:absolute;left:-22px;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--hl-ring)}
mark.hl{background:var(--hl);color:inherit;padding:1px 2px;border-radius:2px;box-shadow:0 0 0 1px var(--hl-ring)}
mark.hl.pulse{animation:pulse 1.6s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--hl-ring)}30%{box-shadow:0 0 0 7px color-mix(in srgb,var(--hl-ring) 35%,transparent)}100%{box-shadow:0 0 0 1px var(--hl-ring)}}
.sign{margin-top:28px;text-align:right;font-size:13.5px}
.sign .scrib{font-family:var(--f-doc);font-style:italic;font-size:18px;opacity:.8}
.sign .cc{text-align:left;margin-top:16px;font-size:11.5px;color:var(--paper-dim);font-family:var(--f-ui)}
.pfoot{position:absolute;left:52px;right:52px;bottom:16px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--paper-dim);border-top:1px solid var(--paper-line);padding-top:6px}
.paper.scan{background:color-mix(in srgb,var(--paper) 88%,#8a8470);filter:contrast(.96);transform:rotate(-.35deg)}
.paper.scan .blk{font-family:var(--f-mono);font-size:13px;letter-spacing:-.01em}
.paper.scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.018) 3px 4px);pointer-events:none}
.ocrbadge{position:absolute;top:10px;right:12px;font-family:var(--f-ui);font-size:10.5px;background:var(--amber-soft);color:var(--amber);border-radius:5px;padding:2px 7px;z-index:2}
.sheet{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:12.5px}
.sheet th{background:color-mix(in srgb,var(--paper-line) 60%,transparent);font-weight:500;font-size:11px;color:var(--paper-dim);border:1px solid var(--paper-line);padding:3px 6px}
.sheet td{border:1px solid var(--paper-line);padding:5px 8px}
.sheet tr.hdr td{font-weight:600;background:color-mix(in srgb,var(--paper-line) 35%,transparent)}
.sheet tr.hlb td{background:var(--hl)}
.sheet td.rn{color:var(--paper-dim);font-size:11px;text-align:center;width:28px}
.blk .bmk{position:absolute;right:-30px;top:0;opacity:0;border:0;background:var(--surface);color:var(--fg-3);border-radius:5px;padding:2px;box-shadow:var(--shadow)}
.blk:hover .bmk,.blk .bmk:focus-visible{opacity:1}

/* Viewer */
.viewer{width:min(46%,760px);flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.vh{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.vh .r1{display:flex;gap:10px;align-items:flex-start}
.vh .r1 .t{flex:1;min-width:0}
.vh .r1 .t b{display:block;font-family:var(--f-doc);font-size:16px;font-weight:600;line-height:1.3}
.vh .r1 .t span{font-size:12px;color:var(--fg-3)}
.cstep{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cstep .q{flex:1;min-width:0;font-size:12.5px;color:var(--fg-2)}
.cstep .q b{color:var(--fg);font-weight:500}
.cstep .q em{font-style:normal;background:var(--hl);color:var(--fg);padding:0 3px;border-radius:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.vtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vtools .pg{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fg-2);padding:0 4px}
.vbody{flex:1;overflow:auto;background:var(--surface-2);padding:20px;display:flex;flex-direction:column;gap:18px;align-items:center}
.vfoot{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center}
.vfoot i{width:10px;height:10px;border-radius:2px;background:var(--hl);box-shadow:0 0 0 1px var(--hl-ring);flex:none}

/* Chat */
.chat{display:flex;flex:1;min-width:0;min-height:0}
.hist{width:268px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.hist .hh{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.hist .hl-list{flex:1;overflow:auto;padding:8px}
.hist .g{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);padding:10px 8px 4px}
.hitem{display:flex;flex-direction:column;gap:2px;border:0;background:transparent;width:100%;text-align:left;padding:8px 10px;border-radius:7px}
.hitem:hover{background:var(--surface-2)}
.hitem.on{background:var(--brand-soft)}
.hitem b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem span{font-size:11.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.conv{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.convh{padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.convh .ttl{font-weight:600;font-size:14px;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40ch}
.scopebtn{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line-2);background:var(--surface-2);border-radius:20px;padding:5px 11px;font-size:12.5px}
.scopebtn b{font-weight:500}
.fcount{background:var(--brand);color:var(--brand-ink);border-radius:10px;font-size:10.5px;padding:0 6px}
.msgs{flex:1;overflow:auto;padding:24px 18px 30px}
.msgs-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mu{align-self:flex-end;max-width:78%;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14px}
.ma{display:flex;gap:12px;align-items:flex-start}
.ma .bot{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ma .box{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;overflow:hidden}
.ma .mh{display:flex;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.ma .mh b{color:var(--fg-2);font-weight:500}
.ma .mb{padding:14px 16px;display:flex;flex-direction:column;gap:11px;font-size:14.5px;line-height:1.65}
.ma .mb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ma .mb .lang-hi{font-size:15px}
.ma .mb table{border-collapse:collapse;font-size:13px;width:100%}
.ma .mb table th{text-align:left;font-weight:500;font-size:12px;color:var(--fg-3);border-bottom:1px solid var(--line);padding:6px 8px}
.ma .mb table td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.ma .mb .sub{font-size:12.5px;color:var(--fg-3)}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border-radius:5px;border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600;font-family:var(--f-ui);vertical-align:2px;line-height:1}
.cite:hover,.cite.on{background:var(--brand);color:var(--brand-ink)}
.srcs{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.srcs .h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);margin-bottom:2px}
.src{display:flex;gap:9px;align-items:center;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px;font-size:12.5px;width:100%}
.src:hover{background:var(--surface)}
.src .n{flex:none;min-width:19px;height:19px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--fg-2)}
.src .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .x b{font-weight:500}
.src .x span{color:var(--fg-3)}
.follow{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--fg-2);text-align:left}
.fchip:hover{border-color:var(--brand);color:var(--brand)}
.macts{display:flex;gap:2px;padding:6px 10px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.macts .btn{padding:5px 8px;font-size:12px}
.macts .btn.on{color:var(--brand);background:var(--brand-soft)}
.banner{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;align-items:flex-start}
.banner.conflict{background:var(--red-soft);color:var(--red)}
.banner.revised{background:var(--brand-soft);color:var(--brand)}
.banner.historical,.banner.scope{background:var(--amber-soft);color:var(--amber)}
.banner.insuff{background:var(--surface-2);color:var(--fg-2);border:1px dashed var(--line-2)}
.banner span{color:var(--fg)}
.thinking{display:flex;flex-direction:column;gap:6px;padding:14px 16px;font-size:13px;color:var(--fg-3)}
.thinking div{display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:12px 18px 14px}
.composer form{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.cbox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line-2);border-radius:12px;padding:8px 8px 8px 14px;background:var(--surface)}
.cbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cbox textarea{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:24px;max-height:140px;padding:4px 0;font-size:14.5px}
.cmeta{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.cmeta select{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:2px 6px;font-size:12px}
.welcome{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.welcome h2{font-family:var(--f-doc);font-size:26px;font-weight:600}
.welcome>p{color:var(--fg-2);max-width:62ch}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sq{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:5px}
.sq:hover{border-color:var(--brand)}
.sq span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.sq b{font-weight:500;font-size:13.5px}

/* Upload */
.upgrid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px 18px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.samples{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.qitem.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.qitem .nm{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .st{font-size:11.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--brand);transition:width .4s}
.suggest{border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));background:color-mix(in srgb,var(--brand-soft) 55%,var(--surface));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:4px 0;border-top:1px solid color-mix(in srgb,var(--brand) 15%,transparent)}
.srow:first-of-type{border-top:0}
.srow .k{color:var(--fg-3);font-size:12px}
.srow .v{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sec{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.sec h4{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec h4 small{font-weight:400;color:var(--fg-3);font-size:12px}
.prevbox{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px;display:flex;gap:12px;align-items:flex-start}
.prevbox img{max-width:170px;max-height:200px;border-radius:4px;border:1px solid var(--line)}
.prevbox pre{margin:0;font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;max-height:180px;overflow:auto;flex:1;min-width:0}
.lowconf{background:var(--red-soft);color:var(--red);border-radius:2px;padding:0 2px}

/* Review */
.rgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.ritem{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:5px}
.ritem.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.ritem b{font-weight:500;font-size:13px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks .c{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.checks .c svg{margin-top:2px}
.checks .c.ok svg{color:var(--green)} .checks .c.warn svg{color:var(--amber)}

/* Collections */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.coll{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px}
.coll:hover{border-color:var(--brand)}
.coll .stack{display:flex;gap:4px}
.coll .stack i{width:30px;height:38px;border-radius:3px;background:var(--paper);border:1px solid var(--paper-line);display:block}
.coll b{font-size:15px;font-weight:600;font-family:var(--f-doc)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .d{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d.out{background:var(--surface-2);color:var(--fg-3)}
.cal .d.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:50%}
.cal .dn{font-size:12px;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center}
.cal .ev{border:0;text-align:left;font-size:11px;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.cal .ev.cf{background:var(--red-soft);color:var(--red)}
.cal .ev.dn2{background:var(--green-soft);color:var(--green);text-decoration:line-through}

/* Reports */
.chart{padding:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-3);font-size:11px;font-family:var(--f-ui)}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(10,13,30,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{width:min(780px,100%)}
.modal .mhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mhd h3{font-size:16px;font-weight:600}
.modal .mbd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.ov.dr{justify-content:flex-end;padding:0}
.ov.dr .modal{height:100%;max-height:100%;border-radius:0;width:min(520px,100%);animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:fade .2s;pointer-events:auto;max-width:90vw}
.dropdown{position:fixed;top:56px;right:16px;width:340px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:90;overflow:hidden}
.summ{font-family:var(--f-doc);background:var(--paper);color:var(--paper-fg);border:1px solid var(--paper-line);border-radius:6px;padding:22px 24px;font-size:14px;line-height:1.65;display:flex;flex-direction:column;gap:10px}
.summ h4{font-size:17px}
.summ .src-l{font-family:var(--f-ui);font-size:12.5px;color:var(--paper-dim)}
.scrim{display:none}
.dgrid>*,.dlayout>*,.upgrid>*,.rgrid>*,.grid2>*,.grid3>*,.kpis>*{min-width:0}
.kpis4{grid-template-columns:repeat(4,1fr)}
.rv2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}

/* Responsive */
@media (max-width:1600px){ .app.vopen .hist{display:none} }
@media (max-width:1280px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:1100px){
  .dgrid,.dlayout,.upgrid,.rgrid{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,1fr)}
  .viewer{position:fixed;inset:0;width:100%;z-index:80;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.sideopen .side{transform:none}
  .app.sideopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .menu-btn{display:grid}
  .hist{position:fixed;inset:0 auto 0 0;z-index:60;width:290px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .chat.histopen .hist{transform:none;display:flex}
  .gsearch{display:none}
  .top{padding:10px 16px}
  .content{padding:18px 16px 40px}
  .drow,.dhead{grid-template-columns:40px minmax(0,1fr) 90px}
  .drow .c3,.drow .c4,.dhead .c3,.dhead .c4{display:none}
  .kpis,.kpis4{grid-template-columns:repeat(2,1fr)}
  .rv2{grid-template-columns:1fr}
  .grid2,.grid3,.sugg,.shortcuts{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:8px}
  .paper{padding:28px 22px 50px;font-size:14px}
  .pfoot{left:22px;right:22px}
  .blk.hlb::before{left:-12px}
  .mu{max-width:90%}
  .msgs{padding:16px 12px}
  .convh{padding:8px 12px}
  .composer{padding:10px 12px 12px}
  .srow{grid-template-columns:1fr auto}.srow .k{grid-column:1/-1}
  .cal .d{min-height:64px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0}
  .strip{padding:5px 16px}
  .filters{grid-template-columns:1fr}
}

D({id:'D01',title:'Revised Leave Rules for Teaching and Non-Teaching Staff 2026',ref:'SVSU/REG/HR/2026/114',type:'Policy',authority:'Registrar',dept:'Human Resources',date:'2026-07-01',effective:'2026-08-01',audience:['Teaching Staff','Non-Teaching Staff','HODs','HOIs'],tags:['HR','Leave'],visibility:'All Staff',status:'Active',revisionOf:'D02',related:['D03','D12'],description:'Replaces the 2023 leave rules. Changes casual, earned and medical leave entitlements and moves applications to the ERP.',
 versions:[{v:'1.0',date:'2026-07-01',by:'Anjali Verma',note:'Original upload'},{v:'1.1',date:'2026-07-04',by:'Anjali Verma',note:'Corrected effective date on page 2 (typo in OCR text)'}],
 pagesRaw:[[['b1','Subject: Revised Leave Rules for Teaching and Non-Teaching Staff, effective 1 August 2026.','subj'],['b2','In supersession of Notification No. SVSU/REG/HR/2023/045 dated 12 April 2023, the competent authority has approved the following revised leave rules for all regular employees of the University and its constituent colleges.'],['b3','1. Casual Leave: Every regular employee is entitled to 12 days of casual leave in a calendar year. Casual leave cannot be carried forward to the next year.'],['b4','2. Casual leave may not be combined with earned leave or any other leave, except special casual leave sanctioned by the Registrar.'],['b5','3. Earned Leave: Non-vacation staff shall earn 30 days of earned leave per year, credited in two half-yearly instalments of 15 days on 1 January and 1 July. Teaching staff availing summer and winter vacation shall earn 10 days per year.']],
 [['b6','4. Medical Leave: An employee may avail up to 10 days of medical leave per year. Medical leave exceeding 3 consecutive days requires a certificate from a registered medical practitioner, preferably from Subharti Hospital.'],['b7','5. All leave applications must be submitted through the University ERP at least 3 working days in advance, except in cases of emergency or illness, which must be regularised within 2 working days of resuming duty.'],['b8','6. Leave of teaching staff during the examination period requires prior approval of the Controller of Examinations in addition to the Head of Department.'],['b9','7. Earned leave can be accumulated up to a maximum of 180 days.'],['b10','These rules come into force from 1 August 2026. All Heads of Institutions are requested to bring this notification to the notice of all employees.']]]}),
D({id:'D02',title:'Leave Rules for University Employees 2023',ref:'SVSU/REG/HR/2023/045',type:'Policy',authority:'Registrar',dept:'Human Resources',date:'2023-04-12',effective:'2023-05-01',expiry:'2026-07-31',audience:['Teaching Staff','Non-Teaching Staff'],tags:['HR','Leave'],visibility:'All Staff',status:'Superseded',supersededBy:'D01',uploadedOn:'2024-02-10',description:'Historical record. Superseded by the Revised Leave Rules 2026 from 1 August 2026.',
 pagesRaw:[[['b1','Subject: Leave Rules for University Employees.','subj'],['b2','1. Casual Leave: Every regular employee is entitled to 10 days of casual leave in a calendar year.'],['b3','2. Earned Leave: Non-vacation staff shall earn 15 days of earned leave per year. Teaching staff availing vacation shall earn 8 days per year.'],['b4','3. Medical Leave: Up to 10 days of medical leave per year may be availed. A medical certificate is required for leave exceeding 2 consecutive days.'],['b5','4. Leave applications shall be submitted in the prescribed paper format to the Head of Department at least 2 days in advance.'],['b6','5. Earned leave can be accumulated up to a maximum of 120 days.']]]}),
D({id:'D03',title:'Biometric Attendance and Office Timings',ref:'SVSU/REG/ADM/2026/089',type:'Policy',authority:'Registrar',dept:'Administration',date:'2026-06-10',effective:'2026-07-01',audience:['Teaching Staff','Non-Teaching Staff','HODs'],tags:['Attendance','HR','Administration'],visibility:'All Staff',status:'Active',related:['D01'],description:'Office hours, grace period, late-arrival deductions and biometric re-enrolment.',
 pagesRaw:[[['b1','Subject: Biometric Attendance and Office Timings for Employees.','subj'],['b2','1. Office hours for all employees are 9:00 AM to 4:30 PM, Monday to Saturday, except second and fourth Saturdays.'],['b3','2. A grace period of 15 minutes is permitted. Arrival after 9:15 AM shall be marked as late.'],['b4','3. Three late arrivals in a calendar month shall result in deduction of half a day of casual leave. If no casual leave is available, the deduction shall be made from salary.'],['b5','4. Employees must mark attendance at both arrival and departure. A missing punch must be regularised by the Head of Department through the ERP within 3 working days.'],['b6','5. All employees whose fingerprint registration is older than 2 years must re-enrol at the IT Cell, Room 104, Administrative Block, by 15 October 2026.']]]}),
D({id:'D04',title:'Schedule of Odd Semester End-Term Examinations, Nov–Dec 2026',ref:'SVSU/COE/2026/317',type:'Notice',authority:'Controller of Examinations',dept:'Examination',date:'2026-09-28',effective:'2026-09-28',expiry:'2026-12-31',audience:['Students','Teaching Staff','HODs','HOIs'],tags:['Examination'],visibility:'Public (students & staff)',status:'Active',related:['D05','D13'],uploadedBy:'Rakesh Gupta',description:'Practical and theory exam dates, admit cards and internal marks deadline.',

const RULES=[

function classify(q){
  const s=' '+q.toLowerCase().replace(/[?।.!,]/g,' ')+' ';
  for(const [k,f] of RULES) if(f(s)) return k;
  if(has(s,['deadline','last date','due date','अंतिम तिथि','आखिरी तारीख','kab tak'])) return 'clarify';
  if(s.trim().split(/\s+/).length<=5&&has(s,['policy','rule','notice','नियम'])) return 'clarifyPol';
  return 'fallback';
}

const HIDDEN_ST=['Pending','Draft','Changes requested','Rejected'];
function permitted(){return S.docs.filter(d=>S.role==='admin'?true:(d.visibility!=='Management Only'&&!HIDDEN_ST.includes(d.status)))}
function answerable(){return permitted().filter(d=>!HIDDEN_ST.includes(d.status)&&d.status!=='Withdrawn')}
function scopeDocs(){
  let ds=answerable();
  if(S.scope.mode==='files') ds=ds.filter(d=>S.scope.files.includes(d.id));
  if(S.scope.mode==='collection'){const co=S.collections.find(x=>x.id===S.scope.coll); ds=ds.filter(d=>co&&co.docs.includes(d.id));}
  const f=S.filters;
  if(f.dept) ds=ds.filter(d=>d.dept===f.dept);
  if(f.subject) ds=ds.filter(d=>d.tags.includes(f.subject));
  if(f.type) ds=ds.filter(d=>d.type===f.type);
  if(f.from) ds=ds.filter(d=>d.date>=f.from);
  if(f.to) ds=ds.filter(d=>d.date<=f.to);
  return ds;
}
function scopeLabel(){
  if(S.scope.mode==='files') return S.scope.files.length+' selected file'+(S.scope.files.length===1?'':'s');
  if(S.scope.mode==='collection'){const co=S.collections.find(x=>x.id===S.scope.coll);return co?co.name:'Collection';}
  return 'All permitted documents';
}
const filterCount=()=>Object.values(S.filters).filter(Boolean).length;

}

/* Library */
function libResults(){
  const L=S.lib;let ds=permitted();
  const q=L.q.trim().toLowerCase();
  if(q) ds=ds.filter(d=>(d.title+' '+d.ref+' '+d.description+' '+d.tags.join(' ')+' '+d.dept+' '+docText(d)).toLowerCase().includes(q));
  if(L.subject) ds=ds.filter(d=>d.tags.includes(L.subject));
  if(L.dept) ds=ds.filter(d=>d.dept===L.dept);
  if(L.aud) ds=ds.filter(d=>d.audience.includes(L.aud));
  if(L.type) ds=ds.filter(d=>d.type===L.type);
  if(L.status) ds=ds.filter(d=>L.status==='Superseded'?['Superseded','Withdrawn'].includes(d.status):d.status===L.status);
  if(L.vis) ds=ds.filter(d=>d.visibility===L.vis);
  if(L.from) ds=ds.filter(d=>d.date>=L.from);
  if(L.to) ds=ds.filter(d=>d.date<=L.to);
  const s={new:(a,b)=>b.date.localeCompare(a.date),old:(a,b)=>a.date.localeCompare(b.date),title:(a,b)=>a.title.localeCompare(b.title),eff:(a,b)=>(b.effective||'').localeCompare(a.effective||'')}[L.sort];
  return ds.sort(s);
}

     <div class="cmeta"><span>${ic('globe','s')} Answer in <select data-on="ansLang" aria-label="Answer language"><option value="auto"${S.ansLang==='auto'?' selected':''}>Same as question</option><option value="en"${S.ansLang==='en'?' selected':''}>English</option><option value="hi"${S.ansLang==='hi'?' selected':''}>हिन्दी</option></select></span><span>Searching ${scopeDocs().length} documents</span><span>Answers are simulated in this prototype and always cite their sources.</span></div></form></div>

function histList(groups,filter=''){
  const out=Object.entries(groups).map(([g,list])=>{const l=list.filter(c=>!filter||c.title.toLowerCase().includes(filter));return l.length?`<div class="g">${esc(g)}</div>${l.map(c=>`<button class="hitem ${c.id===S.active?'on':''}" data-a="openChat" data-id="${c.id}"><b>${esc(c.title)}</b><span>${c.saved?ic('bm','s')+' Saved · ':''}${Math.ceil(c.msgs.length/2)} question${c.msgs.length>2?'s':''}</span></button>`).join('')}`:''}).join('');

function welcome(){return `<div class="welcome"><h2>Ask about SVSU letters, notices and policies</h2><p>Answers come only from documents you are allowed to see. Every claim has a numbered citation. Click a number to open the document at the exact passage.</p>

 <div class="sugg">${SUGG.map(([k,q])=>`<button class="sq" data-a="askChip" data-q="${esc(q)}"><span>${esc(k)}</span><b lang="${/[ऀ-ॿ]/.test(q)?'hi':'en'}">${esc(q)}</b></button>`).join('')}</div></div>`}
function buildAnswer(m){
  if(m.sc==='fallback') return {label:'Demo fallback',cites:[],body:[['p','This prototype only has sample answers for a fixed set of questions, so it can’t answer this one. It will not make up an answer.'],['p','In the full product, the assistant would search the documents you can access and reply only from them, or tell you that no record covers your question.'],['opts',SUGG.slice(0,4).map(x=>x[1])]],follow:[]};
  if(m.sc==='scope'){const miss=m.meta.missing.map(getDoc);return {label:'Outside your scope',banner:['scope','The documents needed for this answer are outside the scope you selected.'],cites:[],body:[['p',`Your current scope (${esc(m.meta.scope)}) doesn’t include the records that answer this question. These permitted documents look relevant:`],['ul',miss.map(d=>`**${d.title}** (${d.ref})`)],['scopeact','']],follow:[]};}

  const a=SC[m.sc](lang);
  if(m.lang==='hi'&&lang==='en') a.body=[...a.body,['sub','A Hindi version of this sample answer is not included in the prototype. The real assistant would answer in Hindi.']];

function partsHtml(t,m){return md(t).replace(/\{(\d+)\}/g,(x,n)=>`<button class="cite" data-a="cite" data-m="${m.id}" data-i="${n-1}" title="Open source ${n}">${n}</button>`)}
function msgHtml(ch,m){

  if(m.pending) return `<div class="ma"><div class="bot">${ic('spark')}</div><div class="box"><div class="thinking"><div><span class="spin"></span>Searching ${m.n} permitted documents…</div>${m.step>0?`<div><span class="spin"></span>Reading matching passages and checking dates…</div>`:''}</div></div></div>`;

    if(t==='table') return `<div class="table-wrap"><table><tr>${v.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${partsHtml(x,m)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    if(t==='opts') return `<div class="chips">${v.map(q=>`<button class="fchip" data-a="askChip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
    if(t==='conflictact') return `<div class="row"><button class="btn sm" data-a="reportConflict">${ic('alert','s')} Report conflict to document owners</button><button class="btn sm ghost" data-a="compareDocs" data-x="D06" data-y="D07">Compare both documents</button></div>`;
    if(t==='reqact') return `<div class="row"><button class="btn sm" data-a="reqDocQ" data-q="${esc(m.q)}">${ic('file','s')} Request this document from HR</button></div>`;
    if(t==='scopeact') return `<div class="row"><button class="btn sm pri" data-a="widenScope" data-m="${m.id}">Search all permitted documents</button><button class="btn sm" data-a="scopeModal">Change scope</button></div>`;
    return '';}).join('');
  const conf=S.aiSettings.showConf&&a.cites.length?`<span>· Evidence: ${a.label==='Conflicting instructions'?'conflicting':a.cites.length>2?'strong':'direct'}</span>`:'';
  return `<div class="ma" id="${m.id}"><div class="bot">${ic('spark')}</div><div class="box">
   <div class="mh"><b>SVSU Assistant</b><span class="pill plain ${KIND_INFO[a.label]||'mute'}">${esc(a.label)}</span><span>Simulated answer</span>${conf}</div>
   <div class="mb">${a.banner?`<div class="banner ${a.banner[0]}">${ic(a.banner[0]==='conflict'?'alert':a.banner[0]==='revised'?'rev':a.banner[0]==='insuff'?'search':'clock','s')}<span>${esc(a.banner[1])}</span></div>`:''}${body}</div>
   ${a.cites.length?`<div class="srcs"><div class="h">Sources</div>${a.cites.map((s,i)=>{const d=getDoc(s.doc);return `<button class="src" data-a="cite" data-m="${m.id}" data-i="${i}"><span class="n">${i+1}</span><span class="x"><b lang="${d.lang}">${esc(d.title)}</b> <span>· ${esc(d.ref)} · page ${s.page}</span></span>${d.status!=='Active'?pill(d.status):''}</button>`}).join('')}</div>`:''}
   ${a.follow&&a.follow.length?`<div class="follow" style="padding-top:12px">${a.follow.map(q=>`<button class="fchip" data-a="askChip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
   <div class="macts"><button class="btn ghost" data-a="copyAns" data-m="${m.id}">${ic('copy','s')} Copy</button><button class="btn ghost ${bm?'on':''}" data-a="bmAns" data-m="${m.id}">${ic('bm','s')} ${bm?'Bookmarked':'Bookmark'}</button><button class="btn ghost" data-a="exportAns" data-m="${m.id}">${ic('export','s')} Export summary</button><span style="flex:1"></span><button class="btn ghost ${m.fb==='up'?'on':''}" data-a="fb" data-m="${m.id}" data-v="up" aria-label="Helpful">${ic('up','s')}</button><button class="btn ghost ${m.fb==='down'?'on':''}" data-a="fb" data-m="${m.id}" data-v="down" aria-label="Not helpful">${ic('down','s')}</button></div>

function afterChat(){const el=$('#msgs');if(el) el.scrollTop=el.scrollHeight;}
function rerenderMsgs(){const ch=activeChat();const el=$('#msgsin');if(el&&ch){el.innerHTML=ch.msgs.length?ch.msgs.map(m=>msgHtml(ch,m)).join(''):welcome();afterChat();}}
function findMsg(id){for(const ch of S.chats){const m=ch.msgs.find(x=>x.id===id);if(m) return [ch,m];}return [null,null]}
function ask(text){
  text=text.trim();if(!text) return;
  if(S.view!=='ask') go('ask');
  let ch=activeChat();
  if(!ch){ch={id:nid('ch'),title:text.length>48?text.slice(0,46)+'…':text,msgs:[{id:nid('m'),role:'user',text}],saved:false,when:'Today'};S.chats.unshift(ch);S.active=ch.id;render();}
  else ch.msgs.push({id:nid('m'),role:'user',text});
  const autoLang=/[ऀ-ॿ]/.test(text)?'hi':'en';
  const lang=S.ansLang==='auto'?autoLang:S.ansLang;
  let sc=classify(text),meta=null;
  if(SC[sc]&&!['insuff','clarify','clarifyPol'].includes(sc)){
    const inScope=new Set(scopeDocs().map(d=>d.id));
    const allowSup=sc==='hist'||sc==='el';
    const need=[...new Set(SC[sc]('en').cites.map(x=>x.doc))].filter(id=>!(allowSup&&getDoc(id).status==='Superseded'&&answerable().some(d=>d.id===id)));
    const miss=need.filter(id=>!inScope.has(id));
    if(miss.length&&(S.scope.mode!=='all'||filterCount())) {meta={orig:sc,missing:miss,scope:scopeLabel()+(filterCount()?' + filters':'')};sc='scope';}
  }
  const m={id:nid('m'),role:'ai',pending:true,step:0,n:scopeDocs().length,q:text};
  ch.msgs.push(m);rerenderMsgs();
  setTimeout(()=>{m.step=1;rerenderMsgs();},550);
  setTimeout(()=>{delete m.pending;m.sc=sc;m.lang=lang;m.meta=meta;
    if(sc==='insuff'&&S.aiSettings.logUnans){const u=S.unanswered.find(x=>x.q.toLowerCase()===text.toLowerCase());if(u){u.count++;u.last=TODAY_S}else S.unanswered.unshift({id:nid('u'),q:text,count:1,dept:'Human Resources',status:'Open',last:TODAY_S});}
    rerenderMsgs();},1300);
}

   <div class="vfoot">${hl?`<i></i><span>Highlighted text is the exact passage cited. Page ${o.page}, paragraph ${o.block.replace(/\D/g,'')}.</span>`:`<span>Viewing full document. Click a citation in an answer to jump to a passage.</span>`}</div>`;
  document.querySelectorAll('.cite.on').forEach(x=>x.classList.remove('on'));

function addQueue(item){
  item=Object.assign({id:nid('q'),status:'processing',step:0,meta:blankMeta(),errors:{},dismissed:{},sugg:{}},item);
  S.upload.queue.push(item);if(!S.upload.sel) S.upload.sel=item.id;
  const steps=STEPS[item.kind]||STEPS.pdf;
  const tick=()=>{item.step++;if(item.step>=steps.length){item.status='ready';if(item.dup) item.dupWarn=true;if(S.upload.sel===item.id&&S.view==='upload') renderUForm();}
    if(S.view==='upload') renderQueue();if(item.status!=='ready') setTimeout(tick,520+Math.random()*300);};
  setTimeout(tick,450);
  if(S.view==='upload'){renderQueue();renderUForm();}
}

function guessFromName(n){
  const s=n.toLowerCase();const tags=[];const map={leave:'Leave',attend:'Attendance',biometric:'Attendance',exam:'Examination',fee:'Fees',scholar:'Scholarship',admission:'Admissions',hr:'HR',it:'IT',password:'IT',finance:'Finance',account:'Finance',holiday:'Administration'};
  Object.entries(map).forEach(([k,v])=>{if(s.includes(k)&&!tags.includes(v)) tags.push(v)});
  const title=n.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
  const type=s.includes('circular')?'Circular':s.includes('notice')?'Notice':s.includes('policy')?'Policy':s.includes('order')?'Office Order':'';
  return {title:title.charAt(0).toUpperCase()+title.slice(1),tags,type,fromName:true};
}
function addLocalFiles(files){
  [...files].forEach(f=>{const kind=fileKind(f.name);if(!kind){toast(`${f.name}: this file type isn’t supported`);return;}
    const size=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB';
    const it={name:f.name,size,kind,local:true,sugg:guessFromName(f.name)};
    const norm=it.sugg.title.toLowerCase();const dup=S.docs.find(d=>{const a=new Set(d.title.toLowerCase().split(/\W+/).filter(w=>w.length>3));const b=norm.split(/\W+/).filter(w=>w.length>3);return b.length>2&&b.filter(w=>a.has(w)).length/b.length>=.6;});if(dup) it.dup=dup.id;

    addQueue(it);});
}

  const q=S.docs.filter(d=>['Pending','Changes requested'].includes(d.status));
  if(!S.reviewSel||!q.find(d=>d.id===S.reviewSel)) S.reviewSel=q[0]&&q[0].id;
  const d=S.reviewSel&&getDoc(S.reviewSel);
  const decided=S.docs.flatMap(x=>x.approvals.filter(a=>/Approved|Rejected|Changes|Withdrawn/.test(a.step)).map(a=>({...a,doc:x}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  const checks=d?[['ok','Required fields complete'],['ok','Reference number follows SVSU/<office>/<year>/<no.> format'],d.id==='D12'?['warn','Mentions leave counts. Confirm it does not change the Revised Leave Rules 2026 (SVSU/REG/HR/2026/114).']:['ok','No conflicting active document found'],d.visibility==='Management Only'?['warn','Visibility is Management Only. Change to All Staff on approval if staff should see it.']:['ok','Visibility: '+d.visibility],['ok','Text extracted from all '+d.pages.length+' page(s)']]:[];
  return `<div class="wrap"><div class="pagehead"><div><h2>Review & Approvals</h2><p>Documents are only used in the library and AI answers after an approver publishes them.</p></div><span class="pill warn">${q.length} waiting</span></div>
  ${q.length?`<div class="rgrid"><div style="display:flex;flex-direction:column;gap:8px">${q.map(x=>`<button class="ritem ${x.id===S.reviewSel?'on':''}" data-a="reviewDoc" data-id="${x.id}"><div class="row between">${ftype(x.fileType)}${pill(x.status)}</div><b>${esc(x.title)}</b><span class="xs muted">${esc(x.dept)} · submitted ${fmtD(x.approvals[0].date)} by ${esc(x.uploadedBy)}</span></button>`).join('')}</div>
   <div class="card"><div class="card-h"><div><h3>${esc(d.title)}</h3><span class="mono muted">${esc(d.ref)}</span></div><button class="btn sm" data-a="openDoc" data-id="${d.id}">Full record</button></div>
    <div class="card-b rv2" id="revbody">
     <div class="pagesbox" style="max-height:560px;padding:14px">${renderPages(d,null,false)}</div>
     <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <dl class="kv" style="grid-template-columns:110px 1fr"><dt>Type</dt><dd>${esc(d.type)}</dd><dt>Authority</dt><dd>${esc(d.authority)}</dd><dt>Effective</dt><dd>${fmtD(d.effective)}</dd><dt>Audience</dt><dd>${esc(d.audience.join(', '))}</dd><dt>Tags</dt><dd>${tagsHtml(d.tags)}</dd><dt>Visibility</dt><dd>${esc(d.visibility)}</dd></dl>
      <div><b class="sm">Automatic checks (simulated)</b><div class="checks" style="margin-top:6px">${checks.map(([k,t])=>`<div class="c ${k}">${ic(k==='ok'?'check':'alert','s')}<span>${esc(t)}</span></div>`).join('')}</div></div>
      <div><b class="sm">Reviewer checklist</b><div class="checks" style="margin-top:6px">${['Content matches the signed original','Tags and audience are correct','Access level is appropriate','Older versions are linked'].map((t,i)=>`<label class="c"><input type="checkbox" id="rc${i}"> ${esc(t)}</label>`).join('')}</div></div>
      <div class="fld"><label for="revc">Comment to uploader</label><textarea class="inp" id="revc" rows="3" placeholder="Required when requesting changes or rejecting"></textarea></div>
      <div class="row"><button class="btn pri" data-a="decide" data-v="approve">${ic('check','s')} Approve & publish</button><button class="btn" data-a="decide" data-v="changes">Request changes</button><button class="btn danger" data-a="decide" data-v="reject">Reject</button></div>
     </div></div></div></div>`:`<div class="card empty"><p><b>All caught up.</b> No documents are waiting for review.</p><button class="btn sm" style="margin-top:10px" data-a="go" data-v="upload">Upload a document</button></div>`}
  <div class="card"><div class="card-h"><h3>Recent decisions</h3></div><div class="table-wrap"><table class="t"><tr><th>Document</th><th>Decision</th><th>By</th><th>Date</th></tr>${decided.map(a=>`<tr><td><button class="link" data-a="openDoc" data-id="${a.doc.id}">${esc(a.doc.title)}</button></td><td><span class="pill ${a.kind||'mute'}">${esc(a.step)}</span></td><td>${esc(a.by)}</td><td class="num">${fmtD(a.date)}</td></tr>`).join('')}</table></div></div></div>`;
};

/* Collections */
V.collections=()=>`<div class="wrap"><div class="pagehead"><div><h2>Collections</h2><p>Group documents for a team or task, then ask questions limited to that group.</p></div><button class="btn pri" data-a="newColl">${ic('plus','s')} New collection</button></div>
 <div class="cgrid">${S.collections.map(co=>`<button class="coll" data-a="openColl" data-id="${co.id}"><div class="stack">${co.docs.slice(0,4).map(()=>'<i></i>').join('')}</div><b>${esc(co.name)}</b><span class="sm muted">${esc(co.desc)}</span><div class="row between xs muted" style="margin-top:auto"><span>${co.docs.length} documents · ${esc(co.owner)}</span><span>Updated ${fmtD(co.updated)}</span></div></button>`).join('')}</div></div>`;
V.coll=()=>{const co=S.collections.find(x=>x.id===S.params.id);if(!co) return '<div class="empty">Collection not found.</div>';
 const ds=co.docs.map(getDoc).filter(Boolean);
 return `<div class="wrap"><div class="crumb"><button data-a="go" data-v="collections">Collections</button>${ic('cr','s')}<span>${esc(co.name)}</span></div>
 <div class="pagehead"><div><h2>${esc(co.name)}</h2><p>${esc(co.desc)}</p></div><div class="row"><button class="btn pri" data-a="askColl" data-id="${co.id}">${ic('spark','s')} Ask this collection</button><button class="btn" data-a="collAdd" data-id="${co.id}">${ic('plus','s')} Add documents</button><button class="btn" data-a="collEdit" data-id="${co.id}">${ic('edit','s')} Rename</button><button class="btn danger" data-a="collDel" data-id="${co.id}">${ic('trash','s')} Delete</button></div></div>
 <div class="card">${ds.length?ds.map(d=>`<div class="li">${ftype(d.fileType)}<div class="main"><b>${esc(d.title)}</b><span class="mono">${esc(d.ref)}</span> <span>· ${esc(d.dept)}</span></div>${pill(d.status)}<button class="btn sm" data-a="openDoc" data-id="${d.id}">Open</button><button class="iconbtn" data-a="collRm" data-id="${co.id}" data-d="${d.id}" aria-label="Remove from collection">${ic('x','s')}</button></div>`).join(''):'<div class="empty">This collection is empty. Add documents to start.</div>'}</div></div>`;};

/* Deadlines */
V.deadlines=()=>{
  let ds=[...S.deadlines].sort((a,b)=>a.date.localeCompare(b.date));
  if(S.dlDept) ds=ds.filter(x=>x.dept===S.dlDept);
  const f=S.dlFilter;
  const list=f==='upcoming'?ds.filter(x=>!x.done&&daysTo(x.date)>=0):f==='overdue'?ds.filter(x=>!x.done&&daysTo(x.date)<0):f==='done'?ds.filter(x=>x.done):ds;
  const groups=[['This week',x=>!x.done&&daysTo(x.date)>=0&&daysTo(x.date)<=7],['Later this month and next',x=>!x.done&&daysTo(x.date)>7],['Overdue',x=>!x.done&&daysTo(x.date)<0],['Completed',x=>x.done]];
  const item=x=>`<div class="li">${dateBox(x.date)}<div class="main"><b style="white-space:normal">${esc(x.title)}</b><span>${esc(x.owner)} · ${esc(x.aud)} · <button class="link" data-a="openDl" data-id="${x.id}">${esc(getDoc(x.doc).ref)}, p.${x.page}</button>${x.conflict?' · <span style="color:var(--red)">conflicts with another document</span>':''}${x.reminder?` · ${ic('bell','s')} ${esc(x.reminder)}`:''}</span></div>${dueHtml(x.date,x.done)}<div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm" data-a="dlRemind" data-id="${x.id}" aria-label="Set reminder">${ic('bell','s')}</button><button class="btn sm ${x.done?'':'ok'}" data-a="dlDone" data-id="${x.id}">${x.done?'Undo':ic('check','s')+' Done'}</button></div></div>`;
  let body;
  if(S.dlView==='list'){body=groups.map(([g,fn])=>{const l=list.filter(fn);return l.length?`<div class="card"><div class="card-h"><h3>${g}</h3><span class="xs muted">${l.length}</span></div>${l.map(item).join('')}</div>`:''}).join('')||`<div class="card empty">No deadlines match these filters.</div>`;}
  else{const [y,mo]=S.calMonth;const first=new Date(y,mo,1);const start=(first.getDay()+6)%7;const dim=new Date(y,mo+1,0).getDate();const cells=[];
   for(let i=0;i<42;i++){const dn=i-start+1;const dt=new Date(y,mo,dn);const iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;const evs=ds.filter(x=>x.date===iso);
    cells.push(`<div class="d ${dn<1||dn>dim?'out':''} ${iso===TODAY_S?'today':''}"><span class="dn">${dt.getDate()}</span>${evs.map(x=>`<button class="ev ${x.conflict?'cf':''} ${x.done?'dn2':''}" data-a="openDl" data-id="${x.id}" title="${esc(x.title)}">${esc(x.title)}</button>`).join('')}</div>`);if(i>=34&&dn>=dim) break;}
   body=`<div class="card"><div class="card-h"><div class="row"><button class="btn sm" data-a="calNav" data-d="-1" aria-label="Previous month">${ic('cl','s')}</button><h3>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3><button class="btn sm" data-a="calNav" data-d="1" aria-label="Next month">${ic('cr','s')}</button></div><span class="xs muted">Red items conflict with another document</span></div><div style="overflow-x:auto"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells.join('')}</div></div></div>`;}
  return `<div class="wrap"><div class="pagehead"><div><h2>Actions & Deadlines</h2><p>Dates and required actions extracted from documents. Each item links to the passage it came from.</p></div><button class="btn pri" data-a="addDl">${ic('plus','s')} Add deadline</button></div>
  <div class="row between"><div class="row"><div class="seg">${[['upcoming','Upcoming'],['overdue','Overdue'],['done','Completed'],['all','All']].map(([k,l])=>`<button class="${S.dlFilter===k?'on':''}" data-a="dlFilter" data-v="${k}">${l}</button>`).join('')}</div><select class="inp" style="width:auto" data-on="dlDept" aria-label="Department">${opt(DEPTS,S.dlDept,'All departments')}</select></div>
  <div class="seg"><button class="${S.dlView==='list'?'on':''}" data-a="dlView" data-v="list">${ic('list','s')} List</button><button class="${S.dlView==='cal'?'on':''}" data-a="dlView" data-v="cal">${ic('cal','s')} Calendar</button></div></div>${body}</div>`;
};

/* Saved */
V.saved=()=>{const tab=S.params.tab||'chats';const saved=S.chats.filter(c=>c.saved);
 let body='';
 if(tab==='chats') body=saved.length?`<div class="card">${saved.map(c=>`<div class="li"><span class="av" style="width:30px;height:30px">${ic('chat','s')}</span><div class="main"><b>${esc(c.savedName||c.title)}</b><span>${Math.ceil(c.msgs.length/2)} questions · ${esc(c.when)} · first question: ${esc(c.msgs[0].text)}</span></div><button class="btn sm" data-a="openChat" data-id="${c.id}">Open</button><button class="btn sm ghost" data-a="renameChat" data-id="${c.id}">Rename</button><button class="iconbtn" data-a="unsaveChat" data-id="${c.id}" aria-label="Remove from saved">${ic('trash','s')}</button></div>`).join('')}</div>`:`<div class="card empty">No saved conversations. Use “Save” in a conversation to keep it here.</div>`;
 if(tab==='answers') body=S.bmAnswers.length?`<div class="card">${S.bmAnswers.map((b,i)=>{const [ch,m]=findMsg(b.msg);if(!m) return '';const a=buildAnswer(m);const plain=a.body.filter(x=>x[0]==='p'||x[0]==='ul').map(x=>x[0]==='p'?x[1]:x[1].join(' ')).join(' ').replace(/\{\d+\}|\*\*/g,'');return `<div class="li"><span class="av" style="width:30px;height:30px">${ic('bm','s')}</span><div class="main"><b>${esc(b.q)}</b><span style="display:block;white-space:normal">${esc(plain.slice(0,170))}…</span><span>${a.cites.length} sources · bookmarked ${esc(b.when)}</span></div><button class="btn sm" data-a="openChatMsg" data-c="${ch.id}" data-m="${m.id}">Open</button><button class="iconbtn" data-a="rmBmAns" data-i="${i}" aria-label="Remove bookmark">${ic('trash','s')}</button></div>`}).join('')}</div>`:`<div class="card empty">No bookmarked answers yet.</div>`;
 if(tab==='passages') body=S.bmPassages.length?`<div class="card">${S.bmPassages.map(b=>{const d=getDoc(b.doc);return `<div class="li"><span class="av" style="width:30px;height:30px">${ic('file','s')}</span><div class="main"><b style="white-space:normal;font-family:var(--f-doc);font-weight:400" lang="${d.lang}">“${esc(b.quote)}”</b><span>${esc(d.title)} · ${esc(d.ref)}, p.${b.page}${b.note?' · Note: '+esc(b.note):''}</span></div><button class="btn sm" data-a="openBm" data-id="${b.id}">Show passage</button><button class="iconbtn" data-a="rmBmP" data-id="${b.id}" aria-label="Remove bookmark">${ic('trash','s')}</button></div>`}).join('')}</div>`:`<div class="card empty">No bookmarked passages. Open a citation and choose “Bookmark passage”.</div>`;
 return `<div class="wrap"><div class="pagehead"><div><h2>Saved Chats & Bookmarks</h2><p>Conversations, answers and document passages you kept for later.</p></div></div>
 <div class="tabs">${[['chats','Saved conversations',saved.length],['answers','Bookmarked answers',S.bmAnswers.length],['passages','Bookmarked passages',S.bmPassages.length]].map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-a="savedTab" data-t="${k}">${l}<span class="c">${n}</span></button>`).join('')}</div>${body}</div>`;};

/* Reports */
V.reports=()=>{const wk=[42,51,48,63,58,71,66,84];const lab=['24 Aug','31 Aug','7 Sep','14 Sep','21 Sep','28 Sep','5 Oct','12 Oct'];const mx=100;
 const W=560,H=200,pl=34,pb=24,bw=(W-pl-10)/wk.length;
 const chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions per week"><g>${[0,25,50,75,100].map(v=>{const y=H-pb-(v/mx)*(H-pb-14);return `<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`}).join('')}</g>${wk.map((v,i)=>{const h=(v/mx)*(H-pb-14);const x=pl+i*bw+bw*.18;return `<rect x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="3" fill="${i===wk.length-1?'var(--brand)':'color-mix(in srgb,var(--brand) 45%,var(--surface))'}"/><text x="${x+bw*.32}" y="${H-pb-h-5}" text-anchor="middle" style="fill:var(--fg-2)">${v}</text><text x="${x+bw*.32}" y="${H-6}" text-anchor="middle">${lab[i]}</text>`}).join('')}</svg>`;
 const fbF=S.params.fb||'all';const fbs=S.feedback.filter(f=>fbF==='all'||f.rating==='down');
 const up=S.feedback.filter(f=>f.rating==='up').length;
 return `<div class="wrap"><div class="pagehead"><div><h2>Reports & Feedback</h2><p>Sample usage figures for the last 8 weeks, plus questions and feedback that need follow-up.</p></div><button class="btn" data-a="copyReport">${ic('copy','s')} Copy as CSV</button></div>
 <div class="kpis kpis4"><div class="kpi"><span>Questions this month</span><b>${412+S.chats.length}</b><small>+18% on September</small></div><div class="kpi"><span>Answered with citations</span><b>88%</b><small>Rest: clarifications or no record</small></div><div class="kpi"><span>Unanswered (open)</span><b>${S.unanswered.filter(u=>u.status!=='Resolved').length}</b><small>Need a document uploaded</small></div><div class="kpi"><span>Rated helpful</span><b>84%</b><small>${S.feedback.length} ratings with comments</small></div></div>
 <div class="dgrid"><div class="card"><div class="card-h"><h3>Questions per week</h3><span class="xs muted">Sample data</span></div><div class="chart">${chart}</div></div>
  <div class="card"><div class="card-h"><h3>Open conflicts between documents</h3></div>${S.conflicts.length?S.conflicts.map(cf=>`<div class="li" style="align-items:flex-start"><span style="color:var(--red);margin-top:2px">${ic('alert','s')}</span><div class="main"><b style="white-space:normal">${esc(cf.topic)}</b><span>${cf.docs.map(id=>esc(getDoc(id).ref)).join(' vs ')} · reported ${esc(cf.reported)} by ${esc(cf.by)}</span><div class="row" style="margin-top:6px"><button class="btn sm" data-a="compareDocs" data-x="${cf.docs[0]}" data-y="${cf.docs[1]}">Compare</button>${cf.status==='Open'?`<button class="btn sm ok" data-a="resolveConflict" data-id="${cf.id}">Mark resolved</button>`:'<span class="pill ok">Resolved</span>'}</div></div></div>`).join(''):'<div class="empty">No open conflicts.</div>'}</div></div>
 <div class="card"><div class="card-h"><h3>Unanswered questions</h3><span class="xs muted">Grouped by question; count shows how often it was asked</span></div><div class="table-wrap"><table class="t"><tr><th>Question</th><th>Times</th><th>Last asked</th><th>Department</th><th>Status</th><th></th></tr>${S.unanswered.map(u=>`<tr><td>${esc(u.q)}</td><td class="num">${u.count}</td><td class="num">${fmtD(u.last)}</td><td>${esc(u.dept)}</td><td><span class="pill ${u.status==='Resolved'?'ok':u.status==='Open'?'warn':'info'}">${esc(u.status)}</span></td><td style="white-space:nowrap;text-align:right"><button class="btn sm" data-a="assignU" data-id="${u.id}">Assign</button> <button class="btn sm" data-a="reqDoc" data-id="${u.id}">Request document</button> ${u.status!=='Resolved'?`<button class="btn sm ok" data-a="resolveU" data-id="${u.id}">Resolve</button>`:''}</td></tr>`).join('')}</table></div></div>
 <div class="card"><div class="card-h"><h3>Answer feedback</h3><div class="seg"><button class="${fbF==='all'?'on':''}" data-a="fbFilter" data-v="all">All (${S.feedback.length})</button><button class="${fbF==='down'?'on':''}" data-a="fbFilter" data-v="down">Not helpful (${S.feedback.length-up})</button></div></div>${fbs.map(f=>`<div class="li" style="align-items:flex-start"><span style="color:${f.rating==='up'?'var(--green)':'var(--red)'};margin-top:2px">${ic(f.rating,'s')}</span><div class="main"><b style="white-space:normal">${esc(f.q)}</b><span style="display:block;white-space:normal">${f.reason?`<span class="tag">${esc(f.reason)}</span> `:''}${esc(f.comment)}</span><span>${esc(f.who)} · ${esc(f.when)}</span></div></div>`).join('')}</div></div>`;};

/* Admin */
V.admin=()=>{const tab=S.params.tab||'users';let body='';
 if(tab==='users') body=`<div class="card"><div class="card-h"><h3>Users and roles</h3><button class="btn sm pri" data-a="addUser">${ic('plus','s')} Add user</button></div><div class="table-wrap"><table class="t"><tr><th>Name</th><th>Department</th><th>Role</th><th>Last active</th><th>Status</th><th></th></tr>${S.users.map(u=>`<tr><td><div class="row" style="flex-wrap:nowrap"><span class="av">${initials(u.name)}</span><div><b style="font-weight:500">${esc(u.name)}</b><div class="xs muted">${esc(u.email)}</div></div></div></td><td>${esc(u.dept)}</td><td><select class="inp" style="width:auto;padding:4px 8px" data-on="userRole" data-id="${u.id}" aria-label="Role for ${esc(u.name)}">${opt(['Administrator','Approver','Uploader','Viewer'],u.role)}</select></td><td>${esc(u.last)}</td><td>${u.active?'<span class="pill ok">Active</span>':'<span class="pill mute">Deactivated</span>'}</td><td style="text-align:right"><button class="btn sm" data-a="toggleUser" data-id="${u.id}">${u.active?'Deactivate':'Reactivate'}</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><div class="card-h"><h3>What each role can do</h3></div><div class="table-wrap"><table class="t"><tr><th>Role</th><th>Ask & view</th><th>Upload</th><th>Approve</th><th>Manage users</th></tr>${[['Administrator',[1,1,1,1]],['Approver',[1,1,1,0]],['Uploader',[1,1,0,0]],['Viewer',[1,0,0,0]]].map(([r,a])=>`<tr><td>${r}</td>${a.map(x=>`<td>${x?`<span style="color:var(--green)">${ic('check','s')}</span>`:'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
 if(tab==='access') body=`<div class="note info">${ic('alert','s')}<p class="sm"><b>Access levels control who can open a document and who the AI may answer from.</b> They are set per document and are independent of subject tags.</p></div><div class="card"><div class="card-h"><h3>Access levels by role</h3><span class="xs muted">Tick to allow</span></div><div class="table-wrap"><table class="t"><tr><th>Role</th>${VIS.map(v=>`<th>${esc(v)}</th>`).join('')}</tr>${Object.entries(S.roleMatrix).map(([r,a])=>`<tr><td>${r}</td>${a.map((x,i)=>`<td><input type="checkbox" ${x?'checked':''} data-on="matrix" data-r="${r}" data-i="${i}" aria-label="${r} can see ${esc(VIS[i])}" ${r==='Administrator'?'disabled':''}></td>`).join('')}</tr>`).join('')}</table></div></div>
  <div class="grid2">${VIS.map(v=>`<div class="card card-b"><div class="row between"><b>${esc(v)}</b><span class="pill mute plain">${S.docs.filter(d=>d.visibility===v).length} docs</span></div><p class="sm muted" style="margin-top:6px">${esc(VIS_DESC[v])}</p></div>`).join('')}</div>`;

/* ---------- Summaries ---------- */
function plainAnswer(m){const a=buildAnswer(m);const lines=[];a.body.forEach(([t,v,rows])=>{const cl=x=>x.replace(/\*\*/g,'').replace(/\{(\d+)\}/g,'[$1]');if(t==='p'||t==='sub') lines.push(cl(v));if(t==='ul') v.forEach(x=>lines.push('• '+cl(x)));if(t==='table'){lines.push(v.join(' | '));rows.forEach(r=>lines.push(r.map(cl).join(' | ')));}if(t==='opts') v.forEach(x=>lines.push('• '+x));});
  if(a.banner) lines.unshift('Note: '+a.banner[1]);
  return {a,text:lines.join('\n')};}
function summaryFor(pairs){
  let txt='SVSU AI Knowledge Assistant — Cited summary\nPROTOTYPE · simulated answers from sample documents\nPrepared '+nowStr()+' by '+(S.role==='admin'?'Dr. Neha Sharma':'Dr. Sameer Khan')+'\n';
  let html=`<div class="summ"><div class="row between"><h4>Cited summary</h4><span class="src-l">Prototype · simulated</span></div><span class="src-l">Prepared ${esc(nowStr())} · Swami Vivekanand Subharti University</span>`;
  pairs.forEach(([q,m])=>{const {a,text}=plainAnswer(m);txt+=`\nQ: ${q}\n${text}\n`;html+=`<hr style="border:0;border-top:1px solid var(--paper-line);width:100%"><b>Q: ${esc(q)}</b><div style="white-space:pre-wrap">${esc(text)}</div>`;
   if(a.cites.length){txt+='Sources:\n';html+='<div class="src-l"><b>Sources</b><br>';a.cites.forEach((s,i)=>{const d=getDoc(s.doc);txt+=`[${i+1}] ${d.title} (${d.ref}), page ${s.page} — "${s.quote}"\n`;html+=`[${i+1}] ${esc(d.title)} (${esc(d.ref)}), p.${s.page} — “${esc(s.quote)}”<br>`});html+='</div>';}});
  html+='</div>';return {txt,html};}
function showSummary(pairs){const {txt,html}=summaryFor(pairs);window._sumTxt=txt;
  modal('Export cited summary',`${html}<p class="xs muted">Printing and file downloads are turned off in this preview. In the full product this would export as PDF or Word with the same citations.</p>`,`<button class="btn" data-a="closeOv">Close</button><button class="btn pri" data-a="copySum">${ic('copy','s')} Copy summary</button>`,'wide');}

 /* review */
